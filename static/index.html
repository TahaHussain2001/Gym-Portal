<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STHX Technologies - Modern Gym Management Portal</title>

  <!-- Google Fonts: Montserrat & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            montserrat: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0A0E1A',
              card: '#121829',
              accent: '#0066FF',
              cyan: '#00F0FF',
              emerald: '#10B981',
              rose: '#F43F5E',
              amber: '#F59E0B',
              border: '#1E293B'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* ── Typography System — Inter Font & Premium SaaS Hierarchy ────────────── */
    *, *::before, *::after {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }

    body {
      background-color: #060913;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif !important;
      font-size: 14px;
      line-height: 1.45;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Page & Dashboard Titles (30px, 700, 1.25) */
    .page-title,
    .text-2xl.font-black.font-montserrat,
    .text-3xl.font-montserrat,
    .text-3xl.font-black {
      font-size: 30px !important;
      font-weight: 700 !important;
      line-height: 1.25 !important;
      letter-spacing: -0.02em !important;
    }

    /* Sidebar Branding Title (16px, 700, 1.25) */
    .sidebar-branding-title {
      font-size: 16px !important;
      font-weight: 700 !important;
      line-height: 1.25 !important;
      letter-spacing: -0.01em !important;
      word-break: normal !important;
      overflow-wrap: normal !important;
    }

    /* Section Titles (22px, 600, 1.3) */
    .section-title,
    h2,
    .text-xl.font-black,
    .text-xl.font-bold,
    .text-2xl.font-bold {
      font-size: 22px !important;
      font-weight: 600 !important;
      line-height: 1.3 !important;
      letter-spacing: -0.01em !important;
    }

    /* Card Titles (18px, 600, 1.35) */
    .card-title,
    h3,
    .text-lg.font-bold,
    .text-lg.font-black,
    .text-base.font-bold {
      font-size: 18px !important;
      font-weight: 600 !important;
      line-height: 1.35 !important;
    }

    /* Statistics Numbers (32px, 700, 1.2) */
    .stat-number,
    .text-3xl.font-black,
    .text-2xl.font-black.font-montserrat {
      font-size: 32px !important;
      font-weight: 700 !important;
      line-height: 1.2 !important;
      letter-spacing: -0.02em !important;
    }

    /* Sidebar Navigation (15px, 500, 1.45) */
    aside nav button,
    aside nav button span,
    .sidebar-item {
      font-size: 15px !important;
      font-weight: 500 !important;
      line-height: 1.45 !important;
    }

    /* Top Navigation (14px, 500, 1.45) */
    header nav,
    header button,
    .top-nav {
      font-size: 14px !important;
      font-weight: 500 !important;
      line-height: 1.45 !important;
    }

    /* Table Headers (14px, 600, 1.4) */
    table th,
    .table-header {
      font-size: 14px !important;
      font-weight: 600 !important;
      line-height: 1.4 !important;
      letter-spacing: 0.02em !important;
      padding-top: 10px !important;
      padding-bottom: 10px !important;
    }

    /* Table Content (14px, 400, 1.45) */
    table td,
    .table-cell {
      font-size: 14px !important;
      font-weight: 400 !important;
      line-height: 1.45 !important;
    }

    /* Form Labels (14px, 500, 1.45) */
    label,
    .form-label {
      font-size: 14px !important;
      font-weight: 500 !important;
      line-height: 1.45 !important;
      margin-bottom: 5px !important;
    }

    /* Input Text (14px, 400, 1.45) */
    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select,
    textarea {
      font-size: 14px !important;
      font-weight: 400 !important;
      line-height: 1.45 !important;
    }

    /* Buttons (14px, 600, 1.35) */
    button,
    .btn,
    .btn-primary,
    .btn-secondary {
      font-size: 14px !important;
      font-weight: 600 !important;
      line-height: 1.35 !important;
      letter-spacing: 0.015em !important;
    }

    /* Status Badges (13px, 600, 1.35) */
    .badge,
    span[class*="bg-"][class*="rounded"],
    .status-badge {
      font-size: 13px !important;
      font-weight: 600 !important;
      line-height: 1.35 !important;
    }

    /* Card Description Text (13px, 400, 1.5) */
    .card-desc,
    p.text-xs,
    p.text-sm {
      font-size: 13px !important;
      font-weight: 400 !important;
      line-height: 1.5 !important;
    }

    /* Helper Text (12px, 400, 1.4) */
    .helper-text,
    .text-\[10px\],
    .text-\[11px\],
    span.text-slate-500,
    p.text-slate-500 {
      font-size: 12px !important;
      font-weight: 400 !important;
      line-height: 1.4 !important;
    }


    .bg-portal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('/static/portal_background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    .glass-panel {
      background: #121829 !important;
      opacity: 1 !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .glass-card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card-hover:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 102, 255, 0.4);
      box-shadow: 0 10px 30px -10px rgba(0, 102, 255, 0.25);
    }

    .neon-text-glow {
      text-shadow: 0 0 12px rgba(0, 102, 255, 0.6);
    }

    .neon-button-glow {
      box-shadow: 0 0 20px rgba(0, 102, 255, 0.4);
    }

    .neon-button-glow:hover {
      box-shadow: 0 0 30px rgba(0, 102, 255, 0.7);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #060913;
    }

    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #0066FF;
    }

    /* ── Theme CSS Variables & Global Overrides ──────────────────────────────── */
    :root {
      --theme-primary: #2563EB;
      --theme-secondary: #1E40AF;
      --theme-accent: #60A5FA;
      --theme-hover: #3B82F6;
      --theme-border: rgba(37, 99, 235, 0.35);
      --bg-overlay-color: rgba(6, 9, 19, 0.72);
    }

    .bg-portal-overlay {
      transition: opacity 0.4s ease, filter 0.4s ease;
    }

    /* ── Unlinked Background Overlay (Independent Layer) ── */
    .bg-portal-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: none !important;
      z-index: 0 !important;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    /* Dynamic Theme Tinted Layout Components in Dark Mode (Every Card & Container) */
    .glass-panel,
    .appear-section {
      background: color-mix(in srgb, var(--theme-primary) 14%, #0F172A) !important;
      border: 1px solid color-mix(in srgb, var(--theme-primary) 28%, rgba(255, 255, 255, 0.12)) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      z-index: 1 !important;
      box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--theme-primary) 25%, transparent) !important;
    }

    body:not(.light-mode) .bg-slate-900\/60,
    body:not(.light-mode) .bg-slate-900\/80,
    body:not(.light-mode) .bg-slate-900,
    body:not(.light-mode) .bg-slate-950\/60,
    body:not(.light-mode) .bg-slate-950 {
      background-color: color-mix(in srgb, var(--theme-primary) 12%, rgba(15, 23, 42, 0.78)) !important;
      border-color: color-mix(in srgb, var(--theme-primary) 25%, rgba(255, 255, 255, 0.1)) !important;
    }

    aside,
    .bg-\[\#090D1B\] {
      background: color-mix(in srgb, var(--theme-primary) 14%, rgba(9, 13, 27, 0.88)) !important;
      border-right: 1px solid color-mix(in srgb, var(--theme-primary) 28%, rgba(255, 255, 255, 0.1)) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
    }

    header {
      background: color-mix(in srgb, var(--theme-primary) 12%, rgba(6, 9, 19, 0.9)) !important;
      border-bottom: 1px solid color-mix(in srgb, var(--theme-primary) 28%, rgba(255, 255, 255, 0.1)) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
    }

    /* 100% Solid Opaque Action Buttons (Unlinked from Background) */
    .bg-brand-accent,
    .bg-blue-600,
    .bg-purple-600,
    .bg-gradient-to-r.from-purple-600.to-indigo-600,
    .bg-gradient-to-r.from-purple-500.to-indigo-500,
    .btn-theme-primary,
    button.btn-theme-primary,
    button[type="submit"] {
      background: var(--theme-primary) !important;
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-hover)) !important;
      color: #FFFFFF !important;
      font-weight: 900 !important;
      font-family: 'Inter', sans-serif !important;
      opacity: 1 !important;
      filter: none !important;
      box-shadow: 0 4px 20px color-mix(in srgb, var(--theme-primary) 65%, transparent) !important;
    }

    /* Solid Opaque Secondary & Reset Buttons */
    button.btn-secondary,
    button.btn-reset,
    button.bg-slate-800,
    button.bg-slate-900 {
      background-color: #1E293B !important;
      border: 1px solid #475569 !important;
      color: #FFFFFF !important;
      font-weight: 900 !important;
      opacity: 1 !important;
      filter: none !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5) !important;
    }

    button.bg-slate-800:hover,
    button.bg-slate-900:hover,
    .btn-reset:hover {
      background-color: #334155 !important;
      border-color: #94A3B8 !important;
      color: #FFFFFF !important;
    }

    /* Force 100% Opacity on All Buttons & Children */
    button,
    button *,
    button span,
    button svg,
    button:disabled,
    button[disabled] {
      opacity: 1 !important;
      color: #FFFFFF !important;
      filter: none !important;
    }

    /* Active Sidebar Navigation Item (Super Admin & Gym Owner) */
    
    /* Sub-nav Buttons & Active Tab High-Contrast White Text Rule */
    button.bg-brand-accent,
    button.bg-brand-accent *,
    button.bg-brand-accent span,
    body.light-mode button.bg-brand-accent,
    body.light-mode button.bg-brand-accent *,
        body.light-mode button.bg-brand-accent,
    body.light-mode button.bg-brand-accent *,
    body.light-mode button.bg-brand-accent span,
    body.light-mode button.bg-slate-800,
    body.light-mode button.bg-slate-800 *,
    body.light-mode button.bg-slate-800 span,
    body.light-mode .force-white-text,
    body.light-mode .force-white-text * {
      color: #FFFFFF !important;
    }
    body.light-mode button.bg-brand-accent span {
      color: #FFFFFF !important;
      font-weight: 800 !important;
    }

    nav button.bg-brand-accent,
    nav button[class*="from-purple-600"],
    aside button[class*="from-purple-600"],
    aside button.bg-brand-accent {
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary)) !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 20px color-mix(in srgb, var(--theme-primary) 40%, transparent) !important;
    }

    /* Badges, Tags & Dynamic Accent Text */
    .text-brand-cyan,
    .text-purple-300,
    .text-purple-400,
    .text-blue-400,
    .text-cyan-300 {
      color: var(--theme-accent) !important;
    }

    .bg-brand-cyan\/10,
    .bg-brand-accent\/10,
    .bg-purple-500\/20,
    .bg-purple-600\/20,
    .bg-purple-600\/30 {
      background-color: color-mix(in srgb, var(--theme-primary) 22%, transparent) !important;
    }

    /* Card Borders & Top Stats Left Accent Borders */
    .border-brand-accent,
    .border-brand-accent\/20,
    .border-brand-accent\/30,
    .border-brand-cyan\/30,
    .border-purple-500\/20,
    .border-purple-500\/30,
    .border-purple-500\/40,
    .border-purple-500\/50,
    .border-blue-500\/20 {
      border-color: var(--theme-border) !important;
    }

    .border-l-4.border-purple-500,
    .border-l-4.border-blue-500,
    .border-l-4.border-cyan-500 {
      border-left-color: var(--theme-primary) !important;
    }

    /* Input Focus Borders */
    .focus\:border-brand-accent:focus,
    .focus\:border-purple-500:focus {
      border-color: var(--theme-primary) !important;
      box-shadow: 0 0 12px color-mix(in srgb, var(--theme-primary) 40%, transparent) !important;
    }

    /* Glass Cards & Hover Glow */
    .glass-card-hover:hover {
      border-color: var(--theme-hover) !important;
      box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--theme-primary) 35%, transparent) !important;
    }

    .neon-button-glow {
      box-shadow: 0 0 20px color-mix(in srgb, var(--theme-primary) 45%, transparent) !important;
    }

    .neon-button-glow:hover {
      box-shadow: 0 0 30px color-mix(in srgb, var(--theme-primary) 70%, transparent) !important;
    }



    /* ── Light Mode High-Contrast UI Styling & Text Colors ─────────────────────── */
    body.light-mode {
      background-color: #F8FAFC !important;
      color: #0F172A !important;
    }

    body.light-mode .glass-panel {
      background: color-mix(in srgb, var(--theme-primary) 6%, rgba(255, 255, 255, 0.95)) !important;
      border-color: color-mix(in srgb, var(--theme-primary) 25%, #CBD5E1) !important;
      box-shadow: 0 4px 20px color-mix(in srgb, var(--theme-primary) 10%, rgba(0, 0, 0, 0.05)) !important;
    }

    /* Headings, Titles & Main Text in Light Mode */
    body.light-mode h1,
    body.light-mode h2,
    body.light-mode h3,
    body.light-mode h4,
    body.light-mode h5,
    body.light-mode h6,
    body.light-mode .text-white,
    body.light-mode .text-slate-100,
    body.light-mode .text-slate-200 {
      color: #0F172A !important;
    }

    /* Subtitles, Paragraphs, Labels, Table Text & Spans in Light Mode */
    body.light-mode p,
    body.light-mode td,
    body.light-mode th,
    body.light-mode label:not(.cursor-pointer):not([class*="bg-slate"]),
    body.light-mode .text-slate-300,
    body.light-mode .text-slate-400,
    body.light-mode .text-slate-500 {
      color: #334155 !important;
    }

    /* Table Headers & Rows in Light Mode */
    body.light-mode table th {
      color: #0F172A !important;
      font-weight: 800 !important;
      border-bottom-color: #CBD5E1 !important;
      background-color: rgba(241, 245, 249, 0.9) !important;
    }
    body.light-mode table td {
      color: #0F172A !important;
      border-bottom-color: #E2E8F0 !important;
    }
    body.light-mode table tr:hover {
      background-color: rgba(241, 245, 249, 0.7) !important;
    }

    /* Status Badges & Pills in Light Mode (Active, Closed, Suspended, Archived, Plans) */
    body.light-mode span[class*="bg-slate-800"],
    body.light-mode .bg-slate-800,
    body.light-mode span[class*="bg-slate-900"],
    body.light-mode .bg-slate-900 {
      background-color: #E2E8F0 !important;
      color: #0F172A !important;
      border-color: #CBD5E1 !important;
      font-weight: 800 !important;
    }

    body.light-mode span[class*="bg-emerald"],
    body.light-mode .bg-emerald-500\/10,
    body.light-mode .bg-emerald-950\/30 {
      background-color: #D1FAE5 !important;
      color: #065F46 !important;
      border-color: #6EE7B7 !important;
      font-weight: 800 !important;
    }
    body.light-mode span[class*="bg-emerald"] *,
    body.light-mode .bg-emerald-500\/10 *,
    body.light-mode .bg-emerald-950\/30 * {
      color: #065F46 !important;
      font-weight: 800 !important;
    }

    body.light-mode span[class*="bg-blue"],
    body.light-mode .bg-blue-500\/10 {
      background-color: #DBEAFE !important;
      color: #1E40AF !important;
      border-color: #93C5FD !important;
      font-weight: 800 !important;
    }
    body.light-mode span[class*="bg-blue"] *,
    body.light-mode .bg-blue-500\/10 * {
      color: #1E40AF !important;
      font-weight: 800 !important;
    }

    body.light-mode span[class*="bg-amber"],
    body.light-mode .bg-amber-500\/10,
    body.light-mode .bg-amber-500\/20,
    body.light-mode .bg-amber-950\/20 {
      background-color: #FEF3C7 !important;
      color: #92400E !important;
      border-color: #FCD34D !important;
      font-weight: 800 !important;
    }
    body.light-mode span[class*="bg-amber"] *,
    body.light-mode .bg-amber-500\/10 *,
    body.light-mode .bg-amber-500\/20 *,
    body.light-mode .bg-amber-950\/20 * {
      color: #92400E !important;
      font-weight: 800 !important;
    }

    body.light-mode span[class*="bg-rose"],
    body.light-mode .bg-rose-500\/10,
    body.light-mode .bg-rose-950\/30 {
      background-color: #FFE4E6 !important;
      color: #9F1239 !important;
      border-color: #FECDD3 !important;
      font-weight: 800 !important;
    }
    body.light-mode span[class*="bg-rose"] *,
    body.light-mode .bg-rose-500\/10 *,
    body.light-mode .bg-rose-950\/30 * {
      color: #9F1239 !important;
      font-weight: 800 !important;
    }

    body.light-mode span[class*="bg-purple"] *,
    body.light-mode .bg-purple-500\/10 * {
      color: #6B21A8 !important;
      font-weight: 800 !important;
    }

    /* Slide-over Drawers & Dark Containers in Light Mode (Pure Light Theme with Black/Dark Text) */
    body.light-mode .fixed .bg-\[\#090D1B\] {
      background: #FFFFFF !important;
      border-left: 1px solid #CBD5E1 !important;
      border-right: 1px solid #CBD5E1 !important;
      color: #0F172A !important;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.15) !important;
    }

    body.light-mode .fixed .bg-\[\#090D1B\] h1,
    body.light-mode .fixed .bg-\[\#090D1B\] h2,
    body.light-mode .fixed .bg-\[\#090D1B\] h3,
    body.light-mode .fixed .bg-\[\#090D1B\] h4,
    body.light-mode .fixed .bg-\[\#090D1B\] h5,
    body.light-mode .fixed .bg-\[\#090D1B\] h6,
    body.light-mode .fixed .bg-\[\#090D1B\] strong {
      color: #0F172A !important;
      font-weight: 800 !important;
    }

    body.light-mode .fixed .bg-\[\#090D1B\] p,
    body.light-mode .fixed .bg-\[\#090D1B\] .text-slate-400,
    body.light-mode .fixed .bg-\[\#090D1B\] .text-slate-300,
    body.light-mode .fixed .bg-\[\#090D1B\] .text-slate-500 {
      color: #475569 !important;
    }

    body.light-mode .fixed .bg-\[\#090D1B\] .bg-slate-950 {
      background-color: #F8FAFC !important;
      border-color: #E2E8F0 !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04) !important;
    }

    body.light-mode .fixed .bg-\[\#090D1B\] .border-slate-800,
    body.light-mode .fixed .bg-\[\#090D1B\] .border-slate-800\/80 {
      border-color: #E2E8F0 !important;
    }

    body.light-mode .fixed .bg-\[\#090D1B\] .text-brand-cyan {
      color: #0284C7 !important;
      font-weight: 700 !important;
    }

    body.light-mode .fixed .bg-\[\#090D1B\] .text-purple-300,
    body.light-mode .fixed .bg-\[\#090D1B\] .text-purple-400 {
      color: #6B21A8 !important;
      font-weight: 700 !important;
    }

    body.light-mode .fixed .bg-\[\#090D1B\] button.bg-slate-900,
    body.light-mode .fixed .bg-\[\#090D1B\] button.bg-slate-950 {
      background-color: #F1F5F9 !important;
      border-color: #CBD5E1 !important;
      color: #0F172A !important;
      font-weight: 800 !important;
    }

    body.light-mode .glass-panel h1,
    body.light-mode .glass-panel h2,
    body.light-mode .glass-panel h3,
    body.light-mode .glass-panel h4 {
      color: #0F172A !important;
    }

    function applyPreferences(prefs) {
      if (!prefs) return;
      const root = document.documentElement;
      root.style.setProperty("--theme-primary", prefs.primary_color || "#2563EB");
      root.style.setProperty("--theme-secondary", prefs.secondary_color || "#1E40AF");
      root.style.setProperty("--theme-accent", prefs.accent_color || "#60A5FA");
      root.style.setProperty("--theme-hover", prefs.hover_color || "#3B82F6");
      root.style.setProperty("--theme-border", prefs.border_color || "rgba(37,99,235,0.3)");

      // Background Overlay ONLY — completely independent from cards & buttons
      const overlays = document.querySelectorAll(".bg-portal-overlay");
      overlays.forEach(overlay => {
        overlay.style.opacity = (prefs.background_opacity ?? 0) / 100;
        overlay.style.filter = `blur(${prefs.background_blur ?? 0}px)`;
        if (prefs.background_image) {
          overlay.style.backgroundImage = `url('${prefs.background_image}')`;
        } else {
          overlay.style.backgroundImage = "url('/static/portal_background.jpg')";
        }
      });

      // Dark / Light mode
      const body = document.body;
      body.classList.remove("light-mode", "dark-mode");
      if (prefs.dark_mode === "light") body.classList.add("light-mode");
      else if (prefs.dark_mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches) body.classList.add("light-mode");

      window.__currentPrefs = prefs;
    }

        overlay.style.filter = "none";
        overlay.style.backgroundImage = "url('/static/portal_background.jpg')";

    // Helper to generate consistent color initials avatar
    function getAvatarInitials(name) {
      if (!name) return "FM";
      const parts = name.trim().split(" ");
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.substring(0, 2).toUpperCase();
    }

    function getAvatarGradient(name) {
      const gradients = [
        "from-blue-600 to-indigo-600",
        "from-emerald-500 to-teal-700",
        "from-purple-600 to-pink-600",
        "from-amber-500 to-orange-600",
        "from-cyan-500 to-blue-600"
      ];
      let hash = 0;
      for (let i = 0; i < (name || "").length; i++) hash += name.charCodeAt(i);
      return gradients[hash % gradients.length];
    }

        : "bg-gradient-to-br from-cyan-500 via-blue-600 to-slate-950 text-cyan-200";

      const initials = getAvatarInitials(user?.name);

        // Global Event-Driven Data Synchronization Channel
    function triggerDataSync(domain = "all") {
      window.dispatchEvent(new CustomEvent("sthx-data-sync", { detail: { domain } }));
    }

    function useDataSync(domains, callback) {
      const callbackRef = React.useRef(callback);
      callbackRef.current = callback;

      const domainKey = Array.isArray(domains) ? domains.join(",") : String(domains);

      React.useEffect(() => {
        const handler = (e) => {
          const targetDomain = e.detail?.domain || "all";
          const domainList = domainKey.split(",");
          if (targetDomain === "all" || domainList.includes("all") || domainList.includes(targetDomain)) {
            if (callbackRef.current) {
              callbackRef.current();
            }
          }
        };
        window.addEventListener("sthx-data-sync", handler);
        return () => window.removeEventListener("sthx-data-sync", handler);
      }, [domainKey]);
    }

    function StatusBadge({ status }) {
      const badgeConfig = {
        Active: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20 dot-emerald",
        Pending: "bg-amber-500/10 text-amber-400 border-amber-500/20 dot-amber",
        Expired: "bg-rose-500/10 text-rose-400 border-rose-500/20 dot-rose",
        Inactive: "bg-slate-500/10 text-slate-400 border-slate-500/20 dot-slate",
        Archived: "bg-purple-500/10 text-purple-400 border-purple-500/20 dot-purple"
      };

      const dotColor = {
        Active: "bg-emerald-400",
        Pending: "bg-amber-400",
        Expired: "bg-rose-400",
        Inactive: "bg-slate-400",
        Archived: "bg-purple-400"
      };

      const currentStyle = badgeConfig[status] || badgeConfig.Pending;
      const currentDot = dotColor[status] || dotColor.Pending;

      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${currentStyle}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${currentDot} animate-pulse`}></span>
          {status}
        </span>
      );
    }

    function formatLocalTime(isoStr) {
      if (!isoStr) return "-";
      let str = String(isoStr);
      if (!str.endsWith("Z") && !str.includes("+") && !str.includes("-")) {
        str += "Z";
      }
      try {
        const d = new Date(str);
        if (isNaN(d.getTime())) return String(isoStr);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
      } catch (e) {
        return String(isoStr);
      }
    }

    function formatLocalDateTime(isoStr) {
      if (!isoStr) return "-";
      let str = String(isoStr);
      if (!str.endsWith("Z") && !str.includes("+") && !str.includes("-")) {
        str += "Z";
      }
      try {
        const d = new Date(str);
        if (isNaN(d.getTime())) return String(isoStr);
        return d.toLocaleDateString([], { month: 'short', day: '2-digit' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
      } catch (e) {
        return String(isoStr);
      }
    }

      const checkAnnouncement = () => {
        fetch("/api/announcement?t=" + Date.now(), { cache: "no-store" })
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data && (data.is_published || data.is_active) && data.message) {
              setAnn(data);
            } else {
              setAnn(null);
            }
          })
          .catch(() => {});
      };

      useEffect(() => {
        checkAnnouncement();
        const timer = setInterval(checkAnnouncement, 5000);
        return () => clearInterval(timer);
      }, []);

      if (!ann || (!ann.is_published && !ann.is_active) || !ann.message) return null;
      if (dismissedId === ann.id) return null;

      const styleKey = ann.banner_style || ann.banner_type || "danger";

        danger: "bg-rose-600 border-rose-700 text-white shadow-rose-900/20",

        info: "bg-indigo-600 border-indigo-700 text-white shadow-indigo-900/20"

          {showPaymentModal && paymentMember && (

              member={paymentMember}
              onClose={() => { setShowPaymentModal(false); setPaymentMember(null); }}
              apiFetch={apiFetch}
              triggerAlert={triggerAlert}
              onPaymentSuccess={(pid) => { setReceiptPaymentId(pid); triggerDataSync("payments"); triggerDataSync("members"); }}
            />
          )}

          {/* Receipt Printing Modal */}
          {receiptPaymentId && (
            <ReceiptModal
              paymentId={receiptPaymentId}

          {/* Change Membership Plan Modal */}

            <ChangePlanModal
              member={changePlanMember}
              onClose={() => { setShowChangePlanModal(false); setChangePlanMember(null); }}
              apiFetch={apiFetch}
              triggerAlert={triggerAlert}
              onPlanChanged={(pid) => { setReceiptPaymentId(pid); triggerDataSync("members"); triggerDataSync("payments"); }}
            />
          )}
        </div>
      </div>
    );

    // Dashboard View Component with Widgets & Charts
    function DashboardView({ apiFetch, onSelectMember, onRecordPayment, setCurrentTab, setInitialStatusFilter }) {
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);
      const revenueChartRef = useRef(null);
      const planChartRef = useRef(null);

      useEffect(() => {
        loadStats();
      }, []);

      useDataSync(["members", "payments", "attendance"], () => {
        loadStats();
      });

      const loadStats = async () => {
        try {
          const res = await apiFetch("/api/dashboard/stats");
          const data = await res.json();
          setStats(data);
          renderCharts(data);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const renderCharts = (data) => {
        setTimeout(() => {
          // Revenue Trend Chart (Rolling 12-Month History)
          if (revenueChartRef.current) {
            const oldRevChart = Chart.getChart(revenueChartRef.current);
            if (oldRevChart) oldRevChart.destroy();
            const ctx = revenueChartRef.current.getContext('2d');
            const history = data.revenue_history || [];
            const labels = history.length > 0 ? history.map(h => h.label) : ['Current Month'];
            const revValues = history.length > 0 ? history.map(h => h.total_revenue) : [data.monthly_revenue || 0];

            new Chart(ctx, {
              type: 'line',
              data: {
                labels: labels,
                datasets: [{
                  label: 'Monthly Revenue (PKR)',
                  data: revValues,
                  borderColor: '#0066FF',
                  backgroundColor: 'rgba(0, 102, 255, 0.15)',
                  fill: true,
                  tension: 0.4,
                  borderWidth: 3,
                  pointRadius: 5,
                  pointBackgroundColor: '#00F0FF'
                }]
              },
              options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                  x: { grid: { color: document.body.classList.contains('light-mode') ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.05)' }, ticks: { color: document.body.classList.contains('light-mode') ? '#1E293B' : '#94A3B8' } },
                  y: { grid: { color: document.body.classList.contains('light-mode') ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.05)' }, ticks: { color: document.body.classList.contains('light-mode') ? '#1E293B' : '#94A3B8' } }
                }
              }
            });
          }

          // Plan Distribution Doughnut Chart
          if (planChartRef.current && data.plan_stats) {
            const oldPlanChart = Chart.getChart(planChartRef.current);
            if (oldPlanChart) oldPlanChart.destroy();
            const ctx = planChartRef.current.getContext('2d');
            // Only show plans that actually have active members
            const activePlans = data.plan_stats.filter(p => p.count > 0);
            const CHART_COLORS = [
              '#0066FF', '#10B981', '#F59E0B', '#F43F5E',
              '#8B5CF6', '#06B6D4', '#EC4899', '#84CC16',
              '#FB923C', '#A78BFA'
            ];
            if (activePlans.length === 0) {
              // Show "no data" message on canvas
              ctx.clearRect(0, 0, planChartRef.current.width, planChartRef.current.height);
              ctx.fillStyle = '#475569';
              ctx.font = '13px Inter, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('No active memberships', planChartRef.current.width / 2, planChartRef.current.height / 2);
            } else {
              new Chart(ctx, {
                type: 'doughnut',
                data: {
                  labels: activePlans.map(p => `${p.plan_name} (${p.count})`),
                  datasets: [{
                    data: activePlans.map(p => p.count),
                    backgroundColor: activePlans.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]),
                    borderWidth: 0
                  }]
                },
                options: {
                  responsive: true,
                  plugins: {
                    legend: {
                      position: 'bottom',
                      labels: { color: '#94A3B8', font: { size: 10 }, padding: 8 }
                    },
                    tooltip: {
                      callbacks: {
                        label: (ctx) => ` ${ctx.label}: ${ctx.parsed} member${ctx.parsed !== 1 ? 's' : ''}`
                      }
                    }
                  },
                  cutout: '70%'
                }
              });
            }
          }
        }, 100);
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center h-64">
            <Icon name="spinner" className="w-10 h-10 text-brand-accent animate-spin" />
          </div>
        );
      }

      return (
        <div className="space-y-8">
          {/* Top 5 Stats Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div
              onClick={() => { setInitialStatusFilter(""); setCurrentTab("members"); }}
              className="glass-panel glass-card-hover p-5 rounded-3xl relative overflow-hidden cursor-pointer group hover:border-brand-cyan/40 transition-all"
            >
              <div className="flex items-center justify-between">
                <div>
                  <p className="text-xs uppercase font-bold text-slate-400 tracking-wider group-hover:text-brand-cyan transition-colors">Total Members</p>
                  <h3 className="text-2xl font-black font-montserrat text-white mt-1">{stats?.total_members || 0}</h3>
                </div>
                <div className="p-3 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-brand-cyan group-hover:scale-110 transition-transform">
                  <Icon name="members" className="w-5 h-5" />
                </div>
              </div>
              <div className="mt-3 flex items-center gap-2 text-[11px] text-slate-400">
                <span className="text-emerald-400 font-bold">+{stats?.today_new_members || 0}</span> today

                  <Icon name="check" className="w-5 h-5" />
                </div>
              </div>
              <div className="mt-3 text-[11px] text-slate-400 truncate">
                Active subscribers
              </div>
            </div>

            <div

    // Members Directory View
    function MembersView({ apiFetch, user, branding, onSelectMember, onOpenRegisterWizard, onRecordPayment, triggerAlert, initialStatusFilter }) {
      const [members, setMembers] = useState([]);
      const [search, setSearch] = useState("");
      const [statusFilter, setStatusFilter] = useState(initialStatusFilter || "");

      useEffect(() => {
        if (initialStatusFilter !== undefined) {
          setStatusFilter(initialStatusFilter);
        }
      }, [initialStatusFilter]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetchMembers();
      }, [search, statusFilter]);

      const fetchMembers = async () => {
        try {
          let url = "/api/members?";
          if (search) url += `search=${encodeURIComponent(search)}&`;
          if (statusFilter) url += `status_filter=${encodeURIComponent(statusFilter)}&`;
          const res = await apiFetch(url);
          const data = await res.json();
          // API returns array or paginated object
          setMembers(Array.isArray(data) ? data : (data.members || []));
        } catch (err) {
          triggerAlert("error", err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteMember = async (id, name, e) => {
        e.stopPropagation();
        if (!window.confirm(`Archive member "${name}"? They will be moved to the Archive for 60 days before permanent removal.`)) return;
        try {
          const res = await apiFetch(`/api/members/${id}`, { method: "DELETE" });
          if (!res.ok) throw new Error("Failed to archive member");
          triggerAlert("success", `"${name}" has been archived successfully.`);
          fetchMembers();
        } catch (err) {
          triggerAlert("error", err.message);
        }
      };

      return (
        <div className="space-y-6">
          {/* Controls toolbar */}
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4 glass-panel p-4 rounded-2xl">
            <div className="flex items-center gap-3 w-full sm:w-auto flex-1 max-w-md">
              <div className="relative w-full">
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Search by name, code, or WhatsApp..."
                  className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-accent"
                />
                <Icon name="search" className="w-4 h-4 text-slate-500 absolute left-3.5 top-3" />
              </div>
            </div>

            <div className="flex items-center gap-3 w-full sm:w-auto">
              <select
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
                className="px-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-800 text-xs text-white focus:outline-none"
              >
                <option value="">All Statuses</option>
                <option value="Active">Active</option>
                <option value="Pending">Pending</option>
                <option value="Expired">Expired</option>

              <button
                onClick={onOpenRegisterWizard}

              >
                <Icon name="plus" className="w-4 h-4" />
                Register Member
              </button>
            </div>
          </div>

          {/* Members Table / Empty Illustration */}
          {loading ? (
            <div className="flex items-center justify-center h-64">
              <Icon name="spinner" className="w-8 h-8 text-brand-accent animate-spin" />
            </div>
          ) : members.length === 0 ? (
            <div className="glass-panel p-12 rounded-3xl text-center space-y-4">
              <div className="w-20 h-20 rounded-full bg-brand-accent/10 border border-brand-accent/20 flex items-center justify-center mx-auto text-brand-cyan">
                <Icon name="members" className="w-10 h-10" />
              </div>
              <h3 className="text-xl font-bold text-white font-montserrat">No Members Found</h3>
              <p className="text-xs text-slate-400 max-w-sm mx-auto">
                No customer records match your current filter criteria. Register your first member to start managing memberships!

              <button
                onClick={onOpenRegisterWizard}
                className="px-6 py-3 bg-brand-accent hover:bg-blue-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all neon-button-glow inline-flex items-center gap-2"
              >
                <Icon name="plus" className="w-4 h-4" />
                Register Member Now
              </button>
            </div>
          ) : (
            <div className="glass-panel rounded-3xl overflow-hidden border border-slate-800">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-950/80 text-slate-400 font-bold uppercase tracking-wider border-b border-slate-800">
                    <tr>
                      <th className="py-4 px-6">Member</th>
                      <th className="py-4 px-6">WhatsApp</th>
                      <th className="py-4 px-6">Plan</th>
                      <th className="py-4 px-6">Status</th>
                      <th className="py-4 px-6">Next Due</th>

                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {members.map((m) => (
                      <tr
                        key={m.id}
                        onClick={() => onSelectMember(m.id)}
                        className="hover:bg-slate-900/60 transition-colors cursor-pointer"

                        <td className="py-4 px-6">
                          <div className="flex items-center gap-3">
                            <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${getAvatarGradient(m.full_name)} flex items-center justify-center text-white font-bold text-xs shadow-md`}>
                              {getAvatarInitials(m.full_name)}
                            </div>
                            <div>
                              <p className="font-bold text-white">{m.full_name}</p>
                              <p className="text-[10px] text-brand-cyan font-mono">{m.member_code}</p>

                        </td>

                        <td className="py-4 px-6">

                        <td className="py-4 px-6 text-slate-300 font-mono">{m.due_date}</td>
                        <td className="py-4 px-6 text-right" onClick={(e) => e.stopPropagation()}>
                          <div className="flex items-center justify-end gap-2">
                            <a
                              href={`https://wa.me/${m.whatsapp_number.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(generatePendingFeeMessage(user?.role || "GYM_OWNER", user?.gym_name || branding?.gym_name || "Gym", m.full_name))}`}
                              target="_blank"
                              rel="noreferrer"
                              className="p-2 rounded-lg bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 transition-colors"
                              title="Message via WhatsApp"
                            >
                              <Icon name="whatsapp" className="w-4 h-4" />
                            </a>
                            {(() => {
                              const today = new Date(); today.setHours(0, 0, 0, 0);
                              const expiry = m.expiry_date && m.expiry_date !== 'None' ? new Date(m.expiry_date) : null;
                              const daysLeft = expiry ? Math.ceil((expiry - today) / 86400000) : 0;
                              const isLocked = expiry && daysLeft > 0;
                              return isLocked ? (
                                <div className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-500 text-xs font-bold flex items-center gap-1 cursor-not-allowed" title={`Next payment available after ${m.expiry_date}`}>
                                  <Icon name="lock" className="w-3.5 h-3.5 inline mr-1 text-amber-400" /> {daysLeft}d left
                                </div>
                              ) : (
                                <button
                                  onClick={() => onRecordPayment(m)}
                                  className="px-3 py-1.5 rounded-lg bg-brand-accent/20 text-brand-cyan hover:bg-brand-accent text-xs font-bold transition-all"
                                >
                                  Pay

                            })()}
                            <button
                              onClick={(e) => handleDeleteMember(m.id, m.full_name, e)}
                              className="p-2 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 transition-colors"

          )}

      );
    }

    // Membership Plans View (Admin Management)
    function PlansView({ apiFetch, user, triggerAlert }) {
      const [plans, setPlans] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editingPlan, setEditingPlan] = useState(null);
      const [planName, setPlanName] = useState("");
      const [price, setPrice] = useState("");
      const [regFee, setRegFee] = useState("1000");
      const [durationDays, setDurationDays] = useState(30);

      const canManagePlans = user.role === 'admin' || user.role === 'gym_owner' || user.role === 'super_admin';

      useEffect(() => {
        loadPlans();
      }, []);

      useDataSync(["plans"], () => {
        loadPlans();
      });

      const loadPlans = async () => {
        try {
          const res = await apiFetch("/api/plans");
          const data = await res.json();
          setPlans(data);
        } catch (err) {
          triggerAlert("error", err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleSavePlan = async (e) => {
        e.preventDefault();
        if (!planName.trim()) return triggerAlert("error", "Plan name is required.");
        if (!price || parseFloat(price) <= 0) return triggerAlert("error", "Please enter a valid price.");
        if (!regFee || parseFloat(regFee) < 0) return triggerAlert("error", "Registration fee must be 0 or more.");
        if (!durationDays || parseInt(durationDays) < 1) return triggerAlert("error", "Duration must be at least 1 day.");
        try {
          const method = editingPlan ? "PUT" : "POST";
          const url = editingPlan ? `/api/plans/${editingPlan.id}` : "/api/plans";
          const res = await apiFetch(url, {
            method,
            body: JSON.stringify({
              plan_name: planName,
              price: parseFloat(price),
              duration_days: parseInt(durationDays)
            })
          });
          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || "Failed to save plan");
          }
          triggerAlert("success", editingPlan ? "Plan updated!" : "New plan created!");
          setShowModal(false);
          loadPlans();
        } catch (err) {
          triggerAlert("error", err.message);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between glass-panel p-6 rounded-3xl">
            <div>
              <h3 className="text-base font-bold text-white uppercase tracking-wider">Membership Subscription Plans</h3>
              <p className="text-xs text-slate-400">Manage monthly fee structures and plan durations.</p>
            </div>
            {canManagePlans && (
              <button
                onClick={() => { setEditingPlan(null); setPlanName(""); setPrice(""); setDurationDays(30); setShowModal(true); }}
                className="px-4 py-2.5 bg-brand-accent hover:bg-blue-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all neon-button-glow flex items-center gap-2"
              >
                <Icon name="plus" className="w-4 h-4" />
                Add New Plan
              </button>
            )}
          </div>

          {loading ? (
            <div className="flex items-center justify-center h-64">
              <Icon name="spinner" className="w-8 h-8 text-brand-accent animate-spin" />
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {plans.map((p) => (
                <div key={p.id} className="glass-panel glass-card-hover p-6 rounded-3xl space-y-4 relative">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-brand-cyan uppercase tracking-wider">{p.duration_days || 30} Days Duration</span>
                    {canManagePlans && (
                      <button
                        onClick={() => { setEditingPlan(p); setPlanName(p.plan_name); setPrice(p.price); setDurationDays(p.duration_days || 30); setShowModal(true); }}
                        className="text-xs font-bold text-brand-cyan hover:text-white transition-colors"
                      >
                        <Icon name="pencil" className="w-3.5 h-3.5 inline mr-1" /> Edit
                      </button>
                    )}
                  </div>

                  <h4 className="text-xl font-bold font-montserrat text-white">{p.plan_name}</h4>

                  <div className="space-y-1 pt-1">
                    <p className="text-2xl font-black font-montserrat text-slate-900 dark:text-white">PKR {p.price.toLocaleString()} <span className="text-xs text-slate-500 dark:text-slate-400 font-normal">/ month</span></p>
                  </div>

                </div>
              ))}
            </div>
          )}

          {/* Add/Edit Plan Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="w-[95%] sm:w-full max-w-md glass-panel p-4 sm:p-6 rounded-3xl border border-white/10 space-y-6 max-h-[90vh] overflow-y-auto scrollbar-thin">
                <h3 className="text-lg font-bold font-montserrat text-white">
                  {editingPlan ? "Edit Membership Plan" : "Create New Membership Plan"}
                </h3>

                <form onSubmit={handleSavePlan} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Plan Name *</label>
                    <input
                      type="text"
                      value={planName}
                      onChange={(e) => setPlanName(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-accent"
                      required
                      placeholder="e.g. Personal Training VIP"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
                    <div className="flex flex-col justify-end">
                      <label className="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1 whitespace-nowrap overflow-hidden text-ellipsis">Price (PKR) *</label>
                      <input
                        type="number"
                        min="0"
                        value={price}
                        onChange={(e) => setPrice(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-accent"
                        required
                        placeholder="3500"
                      />
                    </div>
                    <div className="flex flex-col justify-end">
                      <label className="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1 whitespace-nowrap overflow-hidden text-ellipsis">Duration (Days) *</label>
                      <input
                        type="number"
                        min="1"
                        value={durationDays}
                        onChange={(e) => setDurationDays(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-accent"
                        required
                        placeholder="30"
                      />
                    </div>
                  </div>

                  {/* Live Preview */}
                  {planName && price && (
                    <div className="p-4 rounded-2xl border border-brand-accent/30 bg-brand-accent/5 space-y-1">
                      <p className="text-[10px] font-bold text-brand-cyan uppercase tracking-wider">Preview</p>
                      <p className="text-sm font-bold text-white">{planName}</p>
                      <p className="text-xs text-slate-400">{durationDays} days · PKR {parseFloat(price || 0).toLocaleString()} / cycle</p>
                    </div>
                  )}

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white uppercase"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-brand-accent hover:bg-blue-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl neon-button-glow"
                    >
                      {editingPlan ? "Update Plan" : "Create Plan"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Reports View Component
    function ReportsView({ apiFetch, triggerAlert }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        apiFetch("/api/reports/summary")
          .then(res => res.json())
          .then(d => setData(d))
          .catch(err => triggerAlert("error", err.message))
          .finally(() => setLoading(false));
      }, []);

      const handleExportCSV = async () => {
        try {
          const res = await apiFetch("/api/reports/export-members");
          if (!res.ok) throw new Error("Failed to export members CSV");
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `members_export_${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
          triggerAlert("success", "Members registry exported successfully!");
        } catch (err) {
          triggerAlert("error", err.message);
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center h-64">
            <Icon name="spinner" className="w-8 h-8 text-brand-accent animate-spin" />
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between glass-panel p-6 rounded-3xl">
            <div>
              <h3 className="text-base font-bold text-white uppercase tracking-wider">Financial & Membership Reports</h3>
              <p className="text-xs text-slate-400">Export member registries and review collections revenue analytics.</p>
            </div>
            <button
              onClick={handleExportCSV}
              className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all flex items-center gap-2 shadow-lg shadow-emerald-900/40"

    // Audit Logs View Component (Separate & Isolated per Account)
    function AuditLogsView({ apiFetch }) {
      const [logs, setLogs] = useState([]);
      const [users, setUsers] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [selectedScope, setSelectedScope] = useState("me"); // "me", "all", or user_id integer string
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        loadLogs();
      }, [selectedScope]);

      const loadLogs = async () => {
        setLoading(true);
        setError(null);
        try {
          let param = "?scope=me";
          if (selectedScope === "all") {
            param = "?scope=all";
          } else if (selectedScope !== "me") {
            param = `?user_id=${selectedScope}`;
          }

          const res = await apiFetch(`/api/audit-logs${param}`);
          const data = await res.json();
          if (data && Array.isArray(data.logs)) {
            setLogs(data.logs);
            if (data.users) setUsers(data.users);
            if (data.current_user) setCurrentUser(data.current_user);
          } else if (Array.isArray(data)) {
            setLogs(data);
          } else {
            setLogs([]);
          }
        } catch (err) {
          console.error(err);
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const selectedAccountLabel = selectedScope === "me"
        ? (currentUser?.name ? `${currentUser.name} (My Account)` : "My Account")
        : selectedScope === "all"
          ? "All System Accounts Combined"
          : (users.find(u => String(u.id) === String(selectedScope))?.name || "Selected Account");

      return (
        <div className="space-y-6">
          <div className="glass-panel p-6 rounded-3xl border border-slate-800 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <div className="flex flex-wrap items-center gap-2 mb-1">
                <h3 className="text-base font-bold text-white uppercase tracking-wider">Account Activity Logs</h3>
                <span className="text-[10px] px-2.5 py-1 rounded-lg sm:rounded-full bg-brand-cyan/20 text-brand-cyan border border-brand-cyan/30 font-bold uppercase tracking-widest whitespace-nowrap shrink-0">
                  Isolated Account View
                </span>
              </div>
              <p className="text-xs text-slate-400">
                Security & action audit logs for: <span className="text-white font-bold">{selectedAccountLabel}</span>
              </p>
            </div>

            {/* Account Switcher Controls (Admin) */}
            {currentUser?.role === 'admin' && (
              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => setSelectedScope("me")}
                  className={`px-3 py-1.5 text-xs font-bold uppercase tracking-wider rounded-xl transition-all ${selectedScope === "me" ? 'bg-brand-accent text-white shadow-md shadow-blue-600/30' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                    }`}
                >
                  <Icon name="user" className="w-4 h-4 inline mr-1 text-purple-400" /> My Logs
                </button>
                <button
                  onClick={() => setSelectedScope("all")}
                  className={`px-3 py-1.5 text-xs font-bold uppercase tracking-wider rounded-xl transition-all ${selectedScope === "all" ? 'bg-brand-accent text-white shadow-md shadow-blue-600/30' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                    }`}
                >
                  <Icon name="globe" className="w-4 h-4 inline mr-1 text-cyan-400" /> All Accounts
                </button>
                {users.length > 0 && (
                  <select
                    value={selectedScope}
                    onChange={(e) => setSelectedScope(e.target.value)}
                    className="px-3 py-1.5 bg-slate-900 text-xs text-white font-semibold rounded-xl border border-slate-800 focus:outline-none focus:border-brand-accent"
                  >
                    <option value="me">Filter by Account...</option>
                    {users.map(u => (
                      <option key={u.id} value={u.id}>
                        {u.name} ({u.role.toUpperCase()})
                      </option>
                    ))}
                  </select>
                )}
              </div>
            )}

          {loading ? (
            <div className="flex items-center justify-center h-64">
              <Icon name="spinner" className="w-8 h-8 text-brand-accent animate-spin" />

            <div className="glass-panel p-12 rounded-3xl text-center text-rose-400 text-xs">

            <div className="glass-panel p-12 rounded-3xl text-center text-slate-500 text-xs space-y-1">
              <p className="font-bold text-slate-400">No activity log entries recorded for {selectedAccountLabel}.</p>
              <p>Actions performed by this account will appear here automatically.</p>

                    <tr>
                      <th className="py-4 px-6">Account User</th>

                        <td className="py-3 px-6 text-white font-bold flex items-center gap-2">

    // Archive View Component (Soft-Deleted Members with 60-day Bar)
    function ArchiveView({ apiFetch, triggerAlert }) {
      const [archivedMembers, setArchivedMembers] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadArchived();
      }, []);

      const loadArchived = async () => {
        try {
          const res = await apiFetch("/api/members?archived=true");
          const data = await res.json();
          setArchivedMembers(data);
        } catch (err) {
          triggerAlert("error", err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleRestore = async (id) => {
        try {
          await apiFetch(`/api/members/${id}/restore`, { method: "POST" });
          triggerAlert("success", "Member restored to active registry!");
          loadArchived();
        } catch (err) {
          triggerAlert("error", err.message);
        }
      };

      const handlePermanentDelete = async (id, name) => {
        if (!window.confirm(`⚠️ Permanently delete "${name}"? This action CANNOT be undone and will remove all member data, payments, and history.`)) return;
        try {
          const res = await apiFetch(`/api/members/${id}/permanent`, { method: "DELETE" });
          if (!res.ok) throw new Error("Permanent deletion failed");
          triggerAlert("success", `"${name}" has been permanently deleted.`);
          loadArchived();
        } catch (err) {
          triggerAlert("error", err.message);
        }
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-6 rounded-3xl border border-slate-800">
            <h3 className="text-base font-bold text-white uppercase tracking-wider">Archived Members Registry</h3>
            <p className="text-xs text-slate-400">Soft-deleted member accounts are retained for 60 days before permanent cleanup.</p>
          </div>

          {loading ? (
            <div className="flex items-center justify-center h-64">
              <Icon name="spinner" className="w-8 h-8 text-brand-accent animate-spin" />
            </div>
          ) : archivedMembers.length === 0 ? (
            <div className="glass-panel p-12 rounded-3xl text-center text-xs text-slate-500">
              No archived member records.
            </div>
          ) : (
            <div className="space-y-4">
              {archivedMembers.map((m) => {
                const percentLeft = Math.round((m.days_left_in_archive / 60) * 100);
                return (
                  <div key={m.id} className="glass-panel p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-6 border border-slate-800">
                    <div className="flex items-center gap-4">
                      <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${getAvatarGradient(m.full_name)} flex items-center justify-center text-white font-bold text-sm`}>
                        {getAvatarInitials(m.full_name)}
                      </div>
                      <div>
                        <h4 className="text-base font-bold text-white">{m.full_name}</h4>
                        <p className="text-xs text-slate-400 font-mono">{m.member_code} • {m.whatsapp_number}</p>
                      </div>
                    </div>

                    <div className="w-full sm:w-64 space-y-1.5">
                      <div className="flex justify-between text-[11px] font-bold">
                        <span className="text-slate-400">Archive Retention Window</span>
                        <span className="text-amber-400 font-mono">{m.days_left_in_archive} Days Left</span>
                      </div>
                      <div className="w-full h-2 rounded-full bg-slate-900 overflow-hidden border border-slate-800">
                        <div className="h-full bg-gradient-to-r from-amber-500 to-rose-500 rounded-full" style={{ width: `${percentLeft}%` }}></div>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => handleRestore(m.id)}
                        className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all"
                      >
                        Restore Account
                      </button>
                      <button
                        onClick={() => handlePermanentDelete(m.id, m.full_name)}
                        className="px-4 py-2 bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all flex items-center gap-1.5"
                        title="Permanently delete — cannot be undone"
                      >
                        <Icon name="trash" className="w-3.5 h-3.5" />
                        Delete Forever
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }
